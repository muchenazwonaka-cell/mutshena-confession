<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#ffd6e8" />
<title>Will you be my girlfriend? 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #ffe3ee 0%, #ffd6e8 22%, #f0d9ff 48%, #dbe4ff 75%, #d8f3ff 100%);
    background-size: 400% 400%;
    animation: gradientShift 20s ease infinite;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ---------- floating background hearts ---------- */
  .bg-heart {
    position: fixed;
    bottom: -70px;
    z-index: 0;
    pointer-events: none;
    animation: floatUp linear forwards;
    will-change: transform, opacity;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(.7);      opacity: 0; }
    10%  {                                                        opacity: var(--o, .5); }
    85%  {                                                        opacity: var(--o, .5); }
    100% { transform: translateY(-118vh) rotate(380deg) scale(1.15); opacity: 0; }
  }

  /* ---------- glass card ---------- */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 580px;
    padding: 44px 36px 36px;
    text-align: center;
    border-radius: 36px;
    background: rgba(255, 255, 255, 0.55);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow:
      0 30px 70px -20px rgba(219, 39, 119, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.5) inset,
      0 1px 0 rgba(255, 255, 255, 0.9) inset;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    animation: popIn 0.9s cubic-bezier(.2, 1.4, .4, 1) both;
  }

  @keyframes popIn {
    0%   { transform: scale(.75) translateY(30px); opacity: 0; }
    100% { transform: scale(1) translateY(0);      opacity: 1; }
  }

  .emoji-top {
    font-size: 3rem;
    line-height: 1;
    display: inline-block;
    animation: wobble 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 14px rgba(255, 45, 120, .35));
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50%      { transform: rotate(8deg) translateY(-6px); }
  }

  .title {
    margin-top: 14px;
    font-size: clamp(1.85rem, 6.5vw, 2.75rem);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.5px;
    background: linear-gradient(115deg, #ff2d78 0%, #d926a9 45%, #7c3aed 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin-top: 12px;
    font-size: clamp(0.9rem, 3.4vw, 1.02rem);
    font-weight: 500;
    color: #8b5a86;
    opacity: .9;
  }

  /* ---------- buttons ---------- */
  .buttons {
    margin-top: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 76px;
  }

  .btn {
    font-family: inherit;
    font-weight: 700;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* --- YES --- */
  .btn-yes {
    font-size: clamp(1.05rem, 4.2vw, 1.3rem);
    padding: 17px 40px;
    color: #fff;
    background: linear-gradient(135deg, #ff7aa8 0%, #ff2d78 52%, #d926a9 100%);
    background-size: 200% 200%;
    box-shadow:
      0 12px 26px -8px rgba(255, 45, 120, .8),
      0 0 0 4px rgba(255, 255, 255, .55) inset;
    transform: scale(calc(var(--s, 1) * var(--h, 1)));
    transition: transform .38s cubic-bezier(.2, 1.5, .4, 1), background-position .5s ease;
    animation: glow 1.8s ease-in-out infinite;
    z-index: 3;
  }

  .btn-yes:hover  { --h: 1.07; background-position: 100% 50%; }
  .btn-yes:active { --h: 0.95; }

  @keyframes glow {
    0%, 100% { box-shadow: 0 12px 26px -8px rgba(255,45,120,.75), 0 0 0 4px rgba(255,255,255,.55) inset; }
    50%      { box-shadow: 0 18px 40px -6px rgba(255,45,120,1),   0 0 0 4px rgba(255,255,255,.55) inset; }
  }

  /* --- NO --- */
  .btn-no {
    font-size: clamp(.92rem, 3.6vw, 1.05rem);
    padding: 14px 30px;
    color: #6b7280;
    background: rgba(255, 255, 255, .8);
    border: 2px solid rgba(148, 163, 184, .6);
    transform: translate(0, 0) scale(1) rotate(0deg);
    transition:
      transform .38s cubic-bezier(.2, 1.5, .4, 1),
      background-color .3s ease,
      color .3s ease,
      border-color .3s ease,
      opacity .45s ease,
      box-shadow .3s ease;
    will-change: transform;
    z-index: 2;
  }

  .btn-no:hover { box-shadow: 0 8px 18px -8px rgba(100, 116, 139, .6); }

  .hint {
    margin-top: 18px;
    min-height: 20px;
    font-size: .84rem;
    font-weight: 500;
    color: #a06d9c;
    opacity: .85;
    transition: opacity .3s;
  }

  /* ---------- celebration overlay ---------- */
  .celebrate {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    background: radial-gradient(circle at 50% 40%, rgba(255, 219, 238, .96), rgba(238, 219, 255, .97) 45%, rgba(219, 234, 255, .98));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .55s ease;
  }

  .celebrate.show {
    opacity: 1;
    pointer-events: auto;
  }

  .celebrate-inner {
    transform: scale(.7);
    transition: transform .7s cubic-bezier(.2, 1.5, .4, 1);
  }

  .celebrate.show .celebrate-inner { transform: scale(1); }

  .celebrate-inner .big {
    font-size: clamp(4rem, 20vw, 7rem);
    line-height: 1;
    display: block;
    animation: bounce 1.1s ease-in-out infinite;
    filter: drop-shadow(0 14px 24px rgba(255, 45, 120, .4));
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-16px) scale(1.06); }
  }

  .celebrate-inner h2 {
    margin-top: 18px;
    font-size: clamp(1.9rem, 8vw, 3rem);
    font-weight: 700;
    background: linear-gradient(115deg, #ff2d78, #d926a9 50%, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .celebrate-inner p {
    margin-top: 12px;
    font-size: clamp(.95rem, 4vw, 1.15rem);
    font-weight: 500;
    color: #8b5a86;
    max-width: 420px;
  }

  /* ---------- burst particles ---------- */
  .burst {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    left: 50%;
    top: 50%;
    animation: burstOut 1.5s cubic-bezier(.15, .75, .3, 1) forwards;
  }

  @keyframes burstOut {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
    15%  { opacity: 1; }
    100% {
      transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.25) rotate(var(--r));
      opacity: 0;
    }
  }

  @media (max-width: 400px) {
    .card { padding: 34px 20px 28px; border-radius: 28px; }
    .buttons { gap: 12px; }
    .btn-yes { padding: 15px 30px; }
    .btn-no  { padding: 12px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <div class="card">
    <span class="emoji-top">💌</span>
    <h1 class="title">Will you be my<br>girlfriend?</h1>
    <p class="subtitle">Take your time… but the “No” button is kinda shy 😅</p>

    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">Yes! 💖</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>

    <p class="hint" id="hint"></p>
  </div>

  <div class="celebrate" id="celebrate">
    <div class="celebrate-inner">
      <span class="big">🥰</span>
      <h2>Yaaay! I knew it! 💖</h2>
      <p>You just made me the happiest person alive. I promise to make you smile every single day. 🌸</p>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const yesBtn   = document.getElementById('yesBtn');
  const noBtn    = document.getElementById('noBtn');
  const hint     = document.getElementById('hint');
  const celebrate= document.getElementById('celebrate');

  /* ---------------- No button messages ---------------- */
  const noTexts = [
    'No',
    'Sure?',
    'Really?',
    'Think 🤔',
    'Last chance',
    'Please? 🥺',
    "Don't 😢",
    'Okay… bye? 😭'
  ];

  /* ---------------- No button style presets ---------------- */
  const noStyles = [
    { bg: 'rgba(255,255,255,.8)', color: '#64748b', border: 'rgba(148,163,184,.6)' },
    { bg: '#ffe4e6',              color: '#e11d48', border: '#fda4af' },
    { bg: '#fef3c7',              color: '#b45309', border: '#fcd34d' },
    { bg: '#e0e7ff',              color: '#4338ca', border: '#a5b4fc' },
    { bg: '#dcfce7',              color: '#15803d', border: '#86efac' },
    { bg: '#fae8ff',              color: '#a21caf', border: '#e9a8ff' },
    { bg: '#ccfbf1',              color: '#0f766e', border: '#5eead4' },
    { bg: '#ffedd5',              color: '#c2410c', border: '#fdba74' }
  ];

  let count    = 0;
  let lastTime = 0;
  let finished = false;

  function dodge(e) {
    if (e && e.cancelable) e.preventDefault();
    if (finished) return;

    const now = Date.now();
    if (now - lastTime < 190) return;   // cooldown so it doesn't shrink too fast
    lastTime = now;

    if (count >= noTexts.length) { hideNo(); return; }

    const text = noTexts[count];
    count++;

    /* shrink (never below 42%) */
    const scale = Math.max(0.42, 1 - count * 0.085);

    /* wiggle away */
    const x   = (Math.random() * 80 - 40).toFixed(1);
    const y   = (Math.random() * 56 - 28).toFixed(1);
    const rot = (Math.random() * 30 - 15).toFixed(1);

    /* random new style */
    const s = noStyles[Math.floor(Math.random() * noStyles.length)];

    noBtn.textContent = text;
    noBtn.style.transform     = `translate(${x}px, ${y}px) scale(${scale}) rotate(${rot}deg)`;
    noBtn.style.background    = s.bg;
    noBtn.style.color         = s.color;
    noBtn.style.borderColor   = s.border;

    /* Yes grows as No shrinks */
    const grow = Math.min(1.42, 1 + count * 0.07);
    yesBtn.style.setProperty('--s', grow.toFixed(3));

    /* little hint */
    hint.textContent = count >= 4 ? 'Psst… the “Yes” button is right there 👈' : '';

    if (count >= noTexts.length) hideNo();
  }

  function hideNo() {
    if (finished) return;
    finished = true;
    noBtn.style.transform   = 'translate(0,0) scale(0) rotate(25deg)';
    noBtn.style.opacity     = '0';
    noBtn.style.pointerEvents = 'none';
    hint.textContent = 'The “No” button ran away 🏃‍♀️💨';
  }

  /* mouse + touch + click all trigger the dodge */
  noBtn.addEventListener('pointerenter', dodge);
  noBtn.addEventListener('touchstart', dodge, { passive: false });
  noBtn.addEventListener('click', dodge);
  noBtn.addEventListener('focus', dodge);

  /* ---------------- YES ---------------- */
  yesBtn.addEventListener('click', function () {
    yesBtn.style.animation = 'none';
    yesBtn.style.setProperty('--s', '1');
    celebrate.classList.add('show');
    burst(48);
    setTimeout(() => burst(30), 350);
    setTimeout(() => burst(24), 750);
    rainHearts(2600);
  });

  /* ---------------- heart burst ---------------- */
  const burstEmojis = ['💖','💕','💗','✨','💘','🌸','💞','🎉','💝','🌟'];

  function burst(amount) {
    for (let i = 0; i < amount; i++) {
      const el = document.createElement('span');
      el.className = 'burst';
      el.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];

      const angle = Math.random() * Math.PI * 2;
      const dist  = 110 + Math.random() * 340;

      el.style.setProperty('--x', (Math.cos(angle) * dist).toFixed(1) + 'px');
      el.style.setProperty('--y', (Math.sin(angle) * dist).toFixed(1) + 'px');
      el.style.setProperty('--r', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      el.style.fontSize = (14 + Math.random() * 24) + 'px';
      el.style.animationDelay = (Math.random() * 0.18).toFixed(2) + 's';

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1900);
    }
  }

  /* ---------------- background floating hearts ---------------- */
  const bgEmojis = ['💗','💖','💕','🌸','✨','💞','🩷','💫'];

  function makeHeart() {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = bgEmojis[Math.floor(Math.random() * bgEmojis.length)];
    h.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    h.style.fontSize = (12 + Math.random() * 26).toFixed(0) + 'px';
    h.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
    h.style.animationDelay = (Math.random() * 1.5).toFixed(2) + 's';
    h.style.setProperty('--o', (0.22 + Math.random() * 0.45).toFixed(2));
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 22000);
  }

  for (let i = 0; i < 14; i++) setTimeout(makeHeart, i * 260);
  setInterval(makeHeart, 750);

  /* extra rain after "Yes" */
  function rainHearts(duration) {
    const end = Date.now() + duration;
    (function loop() {
      makeHeart();
      makeHeart();
      if (Date.now() < end) setTimeout(loop, 130);
    })();
  }

  /* safety: stop the whole page from scrolling/zooming on double tap */
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
